name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Check the home page and bot-play every game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: The home page lists every game folder
        run: node tools/build-home.js --check
      - name: Every game links back to the arcade and keeps its controls off its menus
        run: node tools/check-links.js

      - name: Sonic 4 - menus, saving, tablet controls, every hero
        run: npm test --prefix sonic4
      - name: Sonic 4 - all 154 levels
        run: node sonic4/tools/harness.js sonic4/game.js all

      - name: Fruits Takeover - all 30 levels, then the UI flow
        run: npm test --prefix fruits-takeover
